<article class="card-hover border border-slate-200 rounded-xl overflow-hidden flex flex-col bg-white">
  <div class="relative">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="h-40 w-full object-cover">
    {% endif %}
    {% if post.is_featured %}
      <span class="absolute top-2 left-2 bg-accent text-white text-xs font-semibold uppercase tracking-wide px-2 py-1 rounded">Destaque</span>
    {% endif %}
  </div>
  <div class="p-4 flex flex-col flex-1">
    {% if post.published_at %}
      <p class="text-xs text-slate-400">{{ post.published_at|date:"d/m/Y" }}</p>
    {% endif %}
    <h3 class="mt-1 font-semibold text-slate-900">
      <a href="{{ post.get_absolute_url }}" class="hover:text-brand focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded-sm">{{ post.title }}</a>
    </h3>
    <p class="mt-2 text-sm text-slate-600 flex-1">{{ post.content|truncatewords:20 }}</p>
    <a href="{{ post.get_absolute_url }}" class="arrow-link mt-3 text-brand text-sm font-medium hover:underline">
      Ler mais <span class="arrow">→</span>
    </a>
  </div>
</article>
