<div class="card-hover bg-white border border-slate-200 rounded-xl overflow-hidden flex flex-col text-left">
  <img src="{{ price_table.image.url }}" alt="{{ price_table.title }}" class="w-full h-40 object-cover">
  <div class="p-5 flex-1 flex flex-col">
    {% if show_builder_name %}
      <span class="kicker">{{ price_table.builder.name }}</span>
    {% endif %}
    <h3 class="mt-1 font-semibold text-slate-900">{{ price_table.title }}</h3>
    <p class="mt-2 text-sm text-slate-600 flex-1">{{ price_table.description }}</p>
    <a href="{{ price_table.drive_link }}" target="_blank" rel="noopener" class="arrow-link mt-4 text-brand font-medium hover:underline">
      Abrir no Drive <span class="arrow">→</span>
    </a>
    {% if show_actions %}
      <div class="mt-4 pt-4 border-t border-slate-100 flex items-center gap-4 text-sm">
        <a href="{% url 'portal:price_table_update' price_table.pk %}" class="text-brand font-medium hover:underline">Editar</a>
        <a href="{% url 'portal:price_table_delete' price_table.pk %}" class="text-accent font-medium hover:underline">Excluir</a>
      </div>
    {% endif %}
  </div>
</div>
