{% load static %}
<div class="card-hover bg-white border border-slate-200 rounded-xl p-6 text-center flex flex-col items-center">
  {% if partner.logo %}
    <div class="h-32 w-full flex items-center justify-center overflow-hidden rounded-lg mb-4">
      <img src="{{ partner.logo.url }}" alt="{{ partner.name }}" class="max-h-32 max-w-full object-contain">
    </div>
  {% else %}
    <div class="h-28 flex items-center justify-center mb-4">
      <span class="font-semibold text-slate-700">{{ partner.name }}</span>
    </div>
  {% endif %}
  <p class="font-medium text-slate-900">{{ partner.name }}</p>

  <div class="mt-3 flex items-center justify-center gap-3 text-sm">
    {% if partner.website_url %}
      <a href="{{ partner.website_url }}" target="_blank" rel="noopener" class="text-brand hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded-sm">Site</a>
    {% endif %}
    {% if partner.facebook_url %}
      <a href="{{ partner.facebook_url }}" target="_blank" rel="noopener" class="text-brand hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded-sm">Facebook</a>
    {% endif %}
    {% if partner.instagram_url %}
      <a href="{{ partner.instagram_url }}" target="_blank" rel="noopener" class="text-brand hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded-sm">Instagram</a>
    {% endif %}
  </div>
</div>
